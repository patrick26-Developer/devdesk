<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>DevDesk — Developer Toolbox</title>

    <meta
      name="description"
      content="Professional Developer Toolbox built with Electron + React + TypeScript."
    />

    <link
      rel="icon"
      type="image/png"
      href="/branding/devdesk-icon.png"
    />

    <!--
      'unsafe-eval' est nécessaire aux scripts de test / pré-requête de l'API Client
      (exécutés via new Function). L'app n'évalue jamais de contenu distant :
      les réponses d'API sont affichées comme texte, le Markdown est nettoyé par DOMPurify.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        connect-src 'self' https: http:;
      "
    />
  </head>

  <body class="bg-background text-foreground">
    <div id="app"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
